<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Montage Maker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // Match the theme chosen on the main page
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        } catch (e) {}
    </script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --main-bg: rgba(255, 255, 255, 0.95);
            --text-color: #333;
            --muted-color: #6c757d;
            --input-bg: #fff;
            --border-color: #ced4da;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --main-bg: rgba(30, 30, 30, 0.95);
            --text-color: #f0f0f0;
            --muted-color: #adb5bd;
            --input-bg: #2d2d2d;
            --border-color: #444;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        .login-card {
            background: var(--main-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }

        .login-card .text-muted {
            color: var(--muted-color) !important;
        }

        .login-card .form-control {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <main class="login-card text-center">
        <i class="fas fa-gamepad fa-3x mb-3" style="color: #764ba2;"></i>
        <h1 class="h4 mb-1">Gaming Montage Maker</h1>
        <p class="text-muted mb-4">Enter the password to continue</p>

        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" class="form-control form-control-lg mb-3" id="password" name="password"
                   placeholder="Password" autocomplete="current-password" required autofocus>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-lock-open me-2"></i>Enter
            </button>
        </form>
    </main>
</body>
</html>
